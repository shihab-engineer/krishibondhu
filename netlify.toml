[build]
  publish = "."
  functions = "netlify/functions"

# Optional real-AI diagnosis. Without GEMINI_API_KEY the function answers 503 and the app stays in demo mode.
[[redirects]]
  from = "/api/v1/health"
  to = "/.netlify/functions/api"
  status = 200
  force = true

[[redirects]]
  from = "/api/v1/diagnose-crop"
  to = "/.netlify/functions/api"
  status = 200
  force = true

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(self), microphone=(self), geolocation=(self)"
